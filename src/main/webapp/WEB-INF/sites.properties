# Websites served by this one project, all from ONE database (the SRS "website" schema).
# Each content row has a "site" column whose value is the site key below ('srs', 'sanpoly', ...).
#
# URL:      http://host/<context>/<key>/          e.g. /website/srs/   /website/sanpoly/
# Database: <key>.db names the environment variables <DB>_DB_URL / _USER / _PASSWORD
#           (all sites use SRS -> SRS_DB_URL, SRS_DB_USER, SRS_DB_PASSWORD)
# Photos:   bucket folder = <key>.folder (default: the site key), e.g. srs/..., SANPOLY-WEBSITE/...
# Admin:    a user whose users.branch is "Sanpoly" manages only the sanpoly site.
#
# To add a new website:
#   1. add its key to "sites" and copy one block below
#   2. create admin users with users.branch = the new key
#   3. log in to /admin and build its pages (nothing else to migrate)
# Passwords never go in this file.
#
# Own domain per school (optional): <key>.domains=domain1,domain2  (or Railway variable SITE_DOMAINS_<KEY>,
# e.g. SITE_DOMAINS_SANPOLY=sanpoly.edu.in,www.sanpoly.edu.in — the Railway variable wins).
# On its own domain a school opens at "/" with clean links; /srs/ and /sanpoly/ keep working everywhere.
#
# Colours and patterns of each website (optional; leave empty to keep the SRS look):
#   <key>.color1   = main colour: header top strip, menus, footer, headings      (#RRGGBB)
#   <key>.color2   = accent colour: buttons, highlights, lines, hover            (#RRGGBB)
#   <key>.pattern1 = pattern in the header and footer      (image path, e.g. /Home/sanpoly/pattern1.svg)
#   <key>.pattern2 = soft pattern behind the page sections (image path, e.g. /Home/sanpoly/pattern2.svg)

sites=srs,sanpoly
srs.domains=
sanpoly.domains=
default=srs

srs.db=SRS
srs.name=Sandur Residential School
srs.short=SRS
srs.address=Shivapur, Sandur – 583119 · Ballari District, Karnataka · India
srs.tagline=Shivapur, Sandur · Ballari District, Karnataka · Affiliated to CISCE
srs.logo=/Home/logo.png
srs.folder=srs
# SRS keeps its existing brown / orange and peacock patterns
srs.color1=
srs.color2=
srs.pattern1=
srs.pattern2=

sanpoly.db=SRS
sanpoly.name=Sandur Polytechnic
sanpoly.short=Sanpoly
sanpoly.address=Yeshwantnagar - 583124 · Sandur Taluk · Ballari, Karnataka
sanpoly.tagline=Yeshwantnagar · Sandur Taluk · Ballari, Karnataka
sanpoly.logo=/Home/sanlogo.png
sanpoly.folder=SANPOLY-WEBSITE
# Polytechnic purple and green
sanpoly.color1=#32175F
sanpoly.color2=#15A84C
sanpoly.pattern1=/Home/sanpoly/pattern1.svg
sanpoly.pattern2=/Home/sanpoly/pattern2.svg

