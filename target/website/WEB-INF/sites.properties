# Websites served by this one project, all from ONE database (the SRS "website" schema).
# Each content row has a "site" column whose value is the site key below ('srs', 'sanpoly', ...).
#
# URL:      http://host/<context>/<key>/          e.g. /website/srs/   /website/sanpoly/
# Database: <key>.db names the environment variables <DB>_DB_URL / _USER / _PASSWORD
#           (all sites use SRS -> SRS_DB_URL, SRS_DB_USER, SRS_DB_PASSWORD)
# Photos:   bucket folder = <key>.folder (default: the site key), e.g. srs/..., SANPOLY-WEBSITE/...
# Admin:    a user whose users.branch is "Sanpoly" manages only the sanpoly site.
#
# To add a new website:
#   1. add its key to "sites" and copy one block below
#   2. create admin users with users.branch = the new key
#   3. log in to /admin and build its pages (nothing else to migrate)
# Passwords never go in this file.

sites=srs,sanpoly
default=srs

srs.db=SRS
srs.name=Sandur Residential School
srs.short=SRS
srs.address=Shivapur, Sandur – 583119 · Ballari District, Karnataka · India
srs.tagline=Shivapur, Sandur · Ballari District, Karnataka · Affiliated to CISCE
srs.logo=/Home/logo.png
srs.folder=srs

# TODO: put Sanpoly's real name, address, tagline and logo here.
sanpoly.db=SRS
sanpoly.name=Sanpoly
sanpoly.short=Sanpoly
sanpoly.address=Sandur · Ballari District, Karnataka · India
sanpoly.tagline=Sandur · Ballari District, Karnataka
sanpoly.logo=/Home/logo.png
sanpoly.folder=SANPOLY-WEBSITE

